# =============================================================
# 容器内 nginx 配置
# 作用：托管前端静态资源，并把 /api 反向代理到同网络的 api 服务
# 前端 services/api.ts 使用相对路径 /api，必须与前端同源，
# 否则 HttpOnly refresh_token 与 csrf_token Cookie 在纯 HTTP 下会失效
# =============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限，用于文件上传场景
    client_max_body_size 20m;

    # 文本类资源开启压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 带内容 hash 的构建产物，可长期强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 后端接口：proxy_pass 结尾不带 URI，保留 /api 前缀交给 FastAPI
    location /api/ {
        proxy_pass http://api:3601;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 流式对话（SSE）必须关闭缓冲，否则前端无法逐块接收增量内容
        proxy_buffering     off;
        proxy_cache         off;
        proxy_request_buffering off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # 前端使用 React Router 7，未匹配到静态文件时统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
