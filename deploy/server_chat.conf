# =============================================================
# 宿主机 nginx 站点配置（示例）
# 部署位置：/etc/nginx/conf.d/server_chat.conf
# 生效命令：nginx -t && nginx -s reload
# 作用：把 chat.gouxinjie.com 的 80 端口流量转发到容器 127.0.0.1:3610
# =============================================================
server {
    listen 80;
    listen [::]:80;
    server_name chat.gouxinjie.com;

    access_log /var/log/nginx/chat.gouxinjie.com.access.log;
    error_log  /var/log/nginx/chat.gouxinjie.com.error.log;

    # 请求体上限，需与容器内 nginx 保持一致
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3610;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 外层同样关闭缓冲，保证流式对话逐块输出
        proxy_buffering     off;
        proxy_cache         off;
        proxy_request_buffering off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
