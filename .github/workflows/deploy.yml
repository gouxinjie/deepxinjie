# =============================================================
# DeepXinjie 自动发布流水线
# 流程：构建前后端镜像 -> 推送阿里云 ACR -> SSH 登录 ECS 拉取并重启
# 触发：push 到 main 分支，或手动运行
# =============================================================
name: Build & Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 阿里云 ACR 个人实例专属域名（上海地域，公网地址）
  REGISTRY: crpi-5ue84w8rjgqxg0s0.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: gouxinjie
  # 使用 commit sha 作为镜像版本，便于回滚定位
  IMAGE_TAG: ${{ github.sha }}
  # 服务器部署目录
  DEPLOY_PATH: /var/www/chat

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deepxinjie-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deepxinjie-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deepxinjie-web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/deepxinjie-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: 发布到 ECS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # strip_components: 1 后，文件分别落到 /var/www/chat/docker-compose.yml 与 /var/www/chat/schema.sql
      - name: 同步编排文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          source: "deploy/docker-compose.yml,backend/schema.sql"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: 拉取镜像并滚动重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # 校验环境变量文件是否已在服务器准备好
            if [ ! -f .env ]; then
              echo "错误：${{ env.DEPLOY_PATH }}/.env 不存在，请先参考 deploy/.env.example 创建"
              exit 1
            fi

            # 写入本次发布的镜像版本号（不存在则追加）
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ env.IMAGE_TAG }}|" .env
            else
              echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env
            fi

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            # 清理无用镜像，避免磁盘堆积
            docker image prune -f

            sleep 5
            docker compose ps

      - name: 健康检查
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            set -e
            # 最多重试 10 次，等待后端完成建表与启动
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:3610/api/hello > /dev/null; then
                echo "健康检查通过"
                exit 0
              fi
              echo "第 $i 次检查未通过，5 秒后重试"
              sleep 5
            done
            echo "健康检查失败，请查看容器日志：docker compose logs api"
            exit 1
